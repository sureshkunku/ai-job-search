[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ai-job-search"
version = "0.1.0"
description = "AI-powered job search aggregator — LangGraph agents, RAG, semantic search"
requires-python = ">=3.11"

dependencies = [
    # --- Web Framework ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "python-multipart>=0.0.9",
    # --- Data Validation ---
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    # --- Database ---
    "supabase>=2.7.0",
    # --- AI / LLM ---
    "langchain>=0.3.0",
    "langchain-groq>=0.2.0",
    "langchain-community>=0.3.0",
    "langgraph>=0.2.0",
    "langchain-huggingface>=0.1.0",
    # --- Embeddings (free, runs locally) ---
    "sentence-transformers>=3.1.0",
    # --- Search ---
    "rank-bm25>=0.2.2",
    # --- Observability ---
    "langfuse>=2.0.0",
    "loguru>=0.7.2",
    # --- Scraping ---
    "playwright>=1.47.0",
    "apify-client>=1.7.0",
    "httpx>=0.27.0",
    # --- Scheduler ---
    "apscheduler>=3.10.4",
    # --- Email ---
    "sendgrid>=6.11.0",
    # --- Utilities ---
    "python-dotenv>=1.0.0",
    "tenacity>=9.0.0",
    "pybreaker>=1.2.0",
    "rich>=13.8.0",
    "pypdf>=5.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "respx>=0.21.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "ragas>=0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "respx>=0.21.0",
    "ruff>=0.6.0",
    "mypy>=1.11.0",
    "ragas>=0.1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["backend"]

[tool.ruff]
target-version = "py311"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: downloads/loads real ML models (opt-in: set RUN_SLOW_TESTS=1)",
]
testpaths = ["backend/tests"]
addopts = "-v --cov=backend --cov-report=term-missing"
